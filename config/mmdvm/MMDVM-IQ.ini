[General]
Daemon=0

[Log]
DisplayLevel=2
MQTTLevel=0

[MQTT]
Host=127.0.0.1
Port=1883
Auth=0
Username=mmdvm
Password=mmdvm
Keepalive=60
Name=rf-gateway-mmdvm-iq

# MMDVM-IQ reads [Host], [Modem] and [Soapy]. Older versions of this file
# used [MMDVM Host] and gains under [Modem]; those keys are ignored by the
# current MMDVM-IQ, which then ran with RxGain=0 / TxGain=0.
[Host]
HostAddress=127.0.0.1
HostPort=3335
LocalAddress=127.0.0.1
LocalPort=3334
Trace=0

[Modem]
Driver=Soapy
Trace=0

# SXceiver (SoapySX). TxGain stays 0 as before (no change in TX power);
# RxGain=50 is the value this file always intended.
# Network SDRs (PlutoSDR, LibreSDR, Lime, USRP) added in RF Devices get a
# generated copy of this file in backend/data/runtime/mmdvm/.
[Soapy]
Type=sx
RxGain=50
TxGain=0

[Multi]
ModemAddress=127.0.0.1
ModemPort=48200
LocalAddress=127.0.0.1
LocalPort=48100
